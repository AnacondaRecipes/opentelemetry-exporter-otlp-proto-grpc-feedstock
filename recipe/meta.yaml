{% set name = "opentelemetry-exporter-otlp-proto-grpc" %}
{% set version = "1.45.2" %}
{% set ignore_tests = " --ignore=tests/test_otlp_metrics_exporter.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_otlp_trace_exporter.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_otlp_exporter_mixin.py" %}
{% set deselect_tests = "" %}

# E   ModuleNotFoundError: No module named 'opentelemetry.test'
# https://pypi.org/project/opentelemetry-test-utils, not in the main channel.
# 1.40.0: this module now also imports opentelemetry.test (test-utils not on pkgs/main).
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 9e4a6490ca7711479fec7c519425bc09808abbc9a2a1775528edecf200d19a5a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation  # [not win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --no-compile  # [win]
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"  # [win]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - googleapis-common-protos >=1.57,<2.dev0
    - grpcio >=1.63.2,<2.0.0  # [py<313]
    - grpcio >=1.66.2,<2.0.0  # [py==313]
    - grpcio >=1.75.1,<2.0.0  # [py>=314]
    - opentelemetry-api >=1.15,<2.dev0
    - opentelemetry-proto ==1.45.2
    - opentelemetry-sdk >=1.45.2,<1.46.dev0
    - opentelemetry-exporter-otlp-proto-common ==1.45.2
    - typing-extensions >=4.6.0
    - opentelemetry-exporter-otlp-common ==0.66b2
    - typing_extensions >=4.6.0
  run_constrained:
    - opentelemetry-exporter-credential-provider-gcp >=0.59b0

test:
  source_files:
    - tests
  imports:
    - opentelemetry.exporter.otlp.proto.grpc
  commands:
    - pip check
    - pytest -v tests {{ ignore_tests }} {{ deselect_tests }}
  requires:
    - pip
    - pytest

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-grpc
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: OpenTelemetry Python / Protobuf over gRPC Exporter
  description: |-
    OpenTelemetry, also known as OTel for short, is a vendor-neutral open-source
    Observability framework for instrumenting, generating, collecting, and exporting
    telemetry data such as traces, metrics, logs. As an industry-standard
    it is natively supported by a number of vendors.
  doc_url: https://opentelemetry-python.readthedocs.io
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-proto-grpc

extra:
  recipe-maintainers:
    - mariusvniekerk
